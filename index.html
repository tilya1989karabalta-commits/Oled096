<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Төлөм Колонкасы Панели</title>
    <style>
        :root {
            --bg-color: #1a1e29;
            --panel-bg: #222836;
            --text-color: #ffffff;
            --text-muted: #8b9bb4;
            --green-active: #2ecc71;
            --green-hover: #27ae60;
            --border-color: #334155;
            --yellow-display: #f1c40f;
            --blue-display: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 5px;
        }

        /* Language Buttons */
        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .lang-btn {
            padding: 12px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .lang-btn.active {
            background-color: var(--green-active);
            border-color: var(--green-active);
            color: #000;
            font-weight: bold;
        }

        /* Panels */
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .panel-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Input & Quick buttons */
        .amount-input {
            width: 100%;
            padding: 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .quick-btn {
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
        }
        .quick-btn:hover {
            background-color: #2c3a4f;
        }

        /* Main Action Button */
        .action-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--green-active);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover {
            background-color: var(--green-hover);
        }

        /* Display Screen (Emulation) */
        .display-screen {
            background-color: #000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        .display-header {
            background-color: var(--yellow-display);
            color: #000;
            padding: 10px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
        }
        .display-body {
            padding: 20px 10px;
            text-align: center;
        }
        .display-amount {
            color: var(--blue-display);
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .display-status {
            color: var(--blue-display);
            font-size: 18px;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>🔊 ТӨЛӨМ КОЛОНКАСЫ ПАНЕЛИ</h1>
        <p>ESP32-S3 · KY / RU</p>
    </div>

    <!-- LANGUAGE SELECTION -->
    <div class="lang-grid" style="margin-bottom: 20px;">
        <button class="lang-btn active" onclick="setLang('ky')">ПАНЕЛЬ</button>
        <button class="lang-btn" onclick="setLang('ru')">ЖӨНДӨӨ</button>
        <button class="lang-btn active" onclick="setLang('ky')">Кыргызча</button>
        <button class="lang-btn" onclick="setLang('ru')">Русский</button>
    </div>

    <!-- PANEL 1: AMOUNT INPUT -->
    <div class="panel">
        <div class="panel-title">1. СУММА</div>
        <input type="number" id="amountInput" class="amount-input" value="500" min="1">
        
        <div class="quick-amounts">
            <button class="quick-btn" onclick="setAmount(100)">100</button>
            <button class="quick-btn" onclick="setAmount(500)">500</button>
            <button class="quick-btn" onclick="setAmount(1000)">1000</button>
            <button class="quick-btn" onclick="setAmount(5000)">5000</button>
        </div>

        <button class="action-btn" onclick="sendPayment()">Төлөм келди → колонкага жөнөтүү</button>
    </div>

    <!-- PANEL 2: DISPLAY EMULATION -->
    <div class="panel">
        <div class="panel-title">2. КОЛОНКАДА ЭМНЕ ЧЫГАТ</div>
        <div class="display-screen">
            <div class="display-header">Төлөм келди</div>
            <div class="display-body">
                <div class="display-amount" id="screenAmount">500 сом</div>
                <div class="display-status">ТҮШТҮ</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Функция: Сумманы тез тандоо баскычтары үчүн
    function setAmount(value) {
        document.getElementById('amountInput').value = value;
    }

    // Функция: Тил тандоо (Визуалдык гана)
    function setLang(lang) {
        const buttons = document.querySelectorAll('.lang-btn');
        buttons.forEach(btn => {
            if (btn.innerText.includes(lang === 'ky' ? 'Кыргыз' : 'Русский') || 
               (lang === 'ky' && btn.innerText === 'ПАНЕЛЬ') || 
               (lang === 'ru' && btn.innerText === 'ЖӨНДӨӨ')) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // Функция: Төлөмдү жөнөтүү (Симуляция)
    function sendPayment() {
        let amount = document.getElementById('amountInput').value;
        let screenAmount = document.getElementById('screenAmount');
        
        // Текшерүү: бош же 0 болбосун
        if (!amount || amount <= 0) {
            alert("Сураныч, туура сумманы киргизиңиз!");
            return;
        }

        // Экрандагы текстти өзгөртүү
        screenAmount.innerText = amount + " сом";

        // Бул жерде ESP32ге сигнал жөнөтүүчү кодду жазасыз (мисалы fetch)
        /*
        fetch('http://ESP32_IP/amount?value=' + amount)
            .then(response => response.text())
            .then(data => console.log("ESP32 жооп берди:", data))
            .catch(error => console.error("Ката:", error));
        */

        // Визуалдык эффект (жашыл баскычты 1 секундга өзгөртүү)
        let btn = document.querySelector('.action-btn');
        let originalText = btn.innerText;
        btn.innerText = "ЖӨНӨТҮЛДҮ!";
        btn.style.backgroundColor = "#27ae60";
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "";
        }, 1000);
    }
</script>

</body>
</html>
